# Only trusted owner pushes/dispatches enter the isolated homelab pool.
# Public fork PRs keep using GitHub-hosted CI. A host-owned hook also refuses PR events.
name: Homelab validation
on:
  push:
    branches: ['ci/**', 'codex/actions-runner-pool']
  workflow_dispatch:
    inputs:
      suite:
        description: Checks to run
        type: choice
        options: [full, health, long, demo, bench]
        default: full
      years:
        description: The demo suite's years lived (the first full run reached eleven in its six hours)
        type: string
        default: '8'
      demo:
        description: The demo suite's milestone example (M11d added m11_world)
        type: choice
        options: [m11_world, m10_world]
        default: m11_world
      base:
        description: The bench suite's base revision, timed against this one (default M9's close)
        type: string
        default: 31439f4e
      runner:
        description: Pool or a specific machine (an offline specific machine queues)
        type: choice
        options: [tce-ci, node1, node3, node4]
        default: tce-ci
permissions:
  contents: read
concurrency:
  group: homelab-${{ github.ref }}-${{ github.event_name }}-${{ inputs.suite || 'full' }}-${{ inputs.runner || 'tce-ci' }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
jobs:
  health:
    if: github.actor == 'ctadros1' && (inputs.suite == 'health' || github.ref == 'refs/heads/codex/actions-runner-pool')
    strategy:
      fail-fast: false
      matrix:
        node: ${{ inputs.runner == 'node4' && fromJSON('["node4"]') || fromJSON('["node1","node3"]') }}
    runs-on: [self-hosted, Linux, X64, tce-ci, '${{ matrix.node }}']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Attach local Rust build directories
        if: runner.environment == 'self-hosted'
        run: tools/ci/prepare-workspace.sh
      - name: Verify tools, permissions, and capacity
        shell: bash
        run: |
          set -euo pipefail
          [[ $(id -un) == runner ]]
          if sudo -n true 2>/dev/null; then echo 'Runner must not have sudo'; exit 1; fi
          rustup show active-toolchain
          cargo --version
          node --version
          flatc --version
          test "$(flatc --version)" = 'flatc version 25.12.19'
          test "$(node --version | cut -d. -f1)" = v22
          df -h .
          free -h
          printf '### %s\n\nHost: %s\nCommit: %s\n' "$RUNNER_NAME" "$(hostname)" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
  full:
    if: github.actor == 'ctadros1' && (github.event_name == 'push' || inputs.suite == 'full')
    runs-on: [self-hosted, Linux, X64, tce-ci, '${{ inputs.runner || ''tce-ci'' }}']
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Attach local Rust build directories
        if: runner.environment == 'self-hosted'
        run: tools/ci/prepare-workspace.sh
      - name: Full Linux chain
        run: tools/ci/full-chain.sh
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homelab-playwright-${{ runner.name }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
  long:
    if: github.actor == 'ctadros1' && inputs.suite == 'long'
    # tce-long (node3) unless a runner is chosen: node4 runs long jobs too when pinned.
    runs-on: [self-hosted, Linux, X64, tce-ci, '${{ inputs.runner != ''tce-ci'' && inputs.runner || ''tce-long'' }}']
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Attach local Rust build directories
        if: runner.environment == 'self-hosted'
        run: tools/ci/prepare-workspace.sh
      - name: Build and run the long gates
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          cargo build --locked --release -p civ-host
          # Diagnosis branch: the two worlds homelab run 41211124574 failed for want of a first
          # trail, their first year replayed, with the trail margin in the failure.
          target/release/civ-host smoke --years 1 --only core:worldgen/ria_coast:3 --identity e7025af8956dff56faec4f27eaee33a6 || true
          target/release/civ-host smoke --years 1 --only core:worldgen/river_valley:4 --identity e029a953dec9c384576233b24de39082 || true
          exit 0
          target/release/civ-host consistency --json "$RUNNER_TEMP/consistency.json"
          target/release/civ-host notables --json "$RUNNER_TEMP/notables.json"
          target/release/civ-host dashboard --json "$RUNNER_TEMP/dashboard.json"
      - name: Keep gate reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homelab-long-reports
          path: |
            ${{ runner.temp }}/consistency.json
            ${{ runner.temp }}/notables.json
            ${{ runner.temp }}/dashboard.json
          if-no-files-found: ignore
          retention-days: 14
  # A milestone demo's long run (M10 slice EL; M11d), dispatched by the owner: the example's record is
  # kept as an artifact even when the run is cut short.
  demo:
    if: github.actor == 'ctadros1' && inputs.suite == 'demo'
    # tce-long (node3) unless a runner is chosen: node4 runs long jobs too when pinned.
    runs-on: [self-hosted, Linux, X64, tce-ci, '${{ inputs.runner != ''tce-ci'' && inputs.runner || ''tce-long'' }}']
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Attach local Rust build directories
        if: runner.environment == 'self-hosted'
        run: tools/ci/prepare-workspace.sh
      - name: Build and live the milestone demo
        shell: bash
        working-directory: kernel
        env:
          YEARS: ${{ inputs.years }}
          DEMO: ${{ inputs.demo }}
        run: |
          set -euo pipefail
          cargo build --locked --release -p civ-sim --example "$DEMO"
          mkdir -p "$RUNNER_TEMP/demo-saves"
          "target/release/examples/$DEMO" "$RUNNER_TEMP/demo-saves" 6 120 "$YEARS" 2048 2>&1 | tee "$RUNNER_TEMP/demo.txt"
      - name: Keep the demo's record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homelab-${{ inputs.demo }}-demo
          path: ${{ runner.temp }}/demo.txt
          if-no-files-found: ignore
          retention-days: 30
  # M10's gate (plan §7: the bench within 10 % of M9's figures), dispatched by the owner: the base
  # revision and this one built and timed on the same runner and CPUs, interleaved, with M9's gate
  # workload; the summary and every run's log are kept as an artifact.
  bench:
    if: github.actor == 'ctadros1' && inputs.suite == 'bench'
    runs-on: [self-hosted, Linux, X64, tce-ci, tce-long]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Time this revision against the base
        shell: bash
        env:
          BASE: ${{ inputs.base }}
          BENCH_GATE: '1'
        run: tools/ci/bench-compare.sh "$BASE" HEAD "$RUNNER_TEMP/bench"
      - name: Keep the bench's record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homelab-m10-bench
          path: |
            ${{ runner.temp }}/bench/summary.tsv
            ${{ runner.temp }}/bench/environment.txt
            ${{ runner.temp }}/bench/logs/
          if-no-files-found: ignore
          retention-days: 30
