# The ten-year smoke seeds (plan §4.7, the M1 sanity run): every smoke world lives on for ten
# years after its first month and is checked at each year's end, the worlds taking the property
# regimes in turn, and each world's economy is graded at the end. Runs differ from one to the next
# (determinism is not a goal), so this is a nightly signal and a gate on pull requests into main,
# not a check on every push; per-push CI keeps the 30-day smoke (ci.yml).
#
# The sanity dashboard (plan §4.7, M3c slice T) lives five river-valley worlds fifty years and
# grades the rows of §4.7 that apply. It takes too long for pull requests until Accelerated mode is
# faster than Detailed (ADR-0011), so it runs nightly and on demand only; its JSON report is kept.
#
# Gate B (ADR-0011 §5, M3c slice W) lives a year from two fixture worlds five times in each mode
# and compares Accelerated mode's aggregates with Detailed mode's against tolerances fixed in
# PROJECT_PLAN §9. It takes a few minutes, so it runs nightly and on pull requests into main.
#
# The notables' gate (ADR-0014 §4, M4a slice Z) lives two fixture worlds three years five times
# with the notables' tier and five times with every adult deliberating, and compares their polities'
# aggregates against tolerances fixed in PROJECT_PLAN §9. It takes about two minutes, so it runs
# beside Gate B.
#
# The run checks the model, not the platform, so it uses Linux. Actions are pinned as in ci.yml.
name: Ten-year smoke

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ten-year-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  smoke:
    name: Ten-year smoke seeds
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: kernel -> target

      - name: Build civ-host
        working-directory: kernel
        run: cargo build --locked --release -p civ-host

      - name: Ten years of every smoke world
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail
          cargo run --locked --release -p civ-host -- smoke --years 10 | tee "$RUNNER_TEMP/smoke.txt"

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/smoke.txt" ]; then
            { echo '```'; cat "$RUNNER_TEMP/smoke.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  consistency:
    name: Gate B (Accelerated against Detailed)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: kernel -> target

      - name: Build civ-host
        working-directory: kernel
        run: cargo build --locked --release -p civ-host

      - name: A year from two fixtures in each mode
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail
          cargo run --locked --release -p civ-host -- consistency \
            --json "$RUNNER_TEMP/consistency.json" | tee "$RUNNER_TEMP/consistency.txt"

      - name: The notables' tier against every adult deliberating
        if: always()
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail
          cargo run --locked --release -p civ-host -- notables \
            --json "$RUNNER_TEMP/notables.json" | tee "$RUNNER_TEMP/notables.txt"

      - name: Summary
        if: always()
        shell: bash
        run: |
          for f in consistency notables; do
            if [ -f "$RUNNER_TEMP/$f.txt" ]; then
              { echo '```'; cat "$RUNNER_TEMP/$f.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consistency
          path: |
            ${{ runner.temp }}/consistency.json
            ${{ runner.temp }}/notables.json
          if-no-files-found: ignore

  dashboard:
    name: Sanity dashboard (five worlds, fifty years)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: kernel -> target

      - name: Build civ-host
        working-directory: kernel
        run: cargo build --locked --release -p civ-host

      - name: Fifty years of five worlds
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail
          cargo run --locked --release -p civ-host -- dashboard \
            --json "$RUNNER_TEMP/dashboard.json" | tee "$RUNNER_TEMP/dashboard.txt"

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/dashboard.txt" ]; then
            { echo '```'; cat "$RUNNER_TEMP/dashboard.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard
          path: ${{ runner.temp }}/dashboard.json
          if-no-files-found: ignore
