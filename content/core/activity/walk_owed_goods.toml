# Carrying a payment an agreement owes (M5c slice AV, ADR-0020 §7; research 13-02 §1.2 F: "tribute
# requires actual transport and storage"; 13-01 §6.2: "grain must be collected and transported").
# Only for the one who is to carry it: the keeper of the paying store, or else the one who agreed
# to the terms. They take up what the store set aside where it is kept, walk it to the other
# settlement's hearth and hand it over, and walk home the same day; what spoils on the way is lost.
# Chosen only in daylight that lasts the walk there and back. `min_minutes` is the time to take it
# up and to hand it over, each; `max_walk_minutes` one way, as for a visit (research 09-16 §2.1:
# about 25 km a day on foot). Its id sorts after every older activity's: activities are kept in id
# order.
kind = "activity"
