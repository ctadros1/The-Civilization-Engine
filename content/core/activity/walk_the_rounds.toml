# The health officer's round (M10c slice EE, second part; ADR-0035 §7; brief m10-services §2.4):
# only for the one a law names to keep the register of the sick, only in daylight, once a day. The
# round passes the settlement's homes in the watch's set order, a stand of `min_minutes` at each
# (a design prior: long enough to ask after the household and see who lies abed). At each home they
# enter it in the register as seen, and where someone lies abed they see it at first hand; where a
# law pays common work, the store pays their household for the hours.
