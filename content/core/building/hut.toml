# A round post-built hut with wattle-and-daub walls and a conical thatched roof: the one building
# program of M1 (plan §7; ADR-0004 §2). The grammar is code (`civ-grammar`); every dimension,
# labour and material figure is here. Labour is in person-hours of a capable adult; pd8 is eight
# of them (research 11-04 §2.2). A hut for five comes to about 500 hours of building, 1.5 t of
# timber and 1.7 t of thatch, before the materials are cut and carried.
kind = "building"
id = "core:building/hut"
name = "Hut"
grammar = "hut"
use = "dwelling"
eave_cm = 180                    # head height at the wall (tuning)
pitch_deg = 45.0                 # 11-01 §3: grass thatch wants at least 45° to shed rain
roof_by_day = 304                # 1 November: under a roof before winter (tuning)
technique = "core:technique/roundhouse"   # ADR-0008 §1
skill = "core:skill/building"     # trained by building it (ADR-0009 §6)

[upkeep]
# How its parts wear and decay (ADR-0009 §4): for each kind, the share of its section or covering
# lost a year and the share at which it shows. Thatch wants significant mending every 2-3 years
# (11-08 §2.4); no report gives rates for posts set in the ground or for daub at a wall's foot
# (11-06 §2.2, 11-08 §2.4: decay needs wet wood, and earth walls last as long as water is kept
# off them), so those are tuning values. Posts rot at their foot on ground of wetness 1 (the land
# profile's habitats set it); timber under a roof decays only under a leak, at the rate given for
# a full leak.
covering = [0.06, 0.15]          # [lost a year, leaks at]
posts = [0.02, 0.3]              # [lost a year at the foot, rot shows at] (tuning)
infill = [0.05, 0.2]             # [worn a year at the foot, shows at] (tuning)
under_leak = [0.1, 0.3]          # [lost a year under a full leak, shows at] (tuning)

[materials]
timber = "core:good/timber"      # posts and rafters
wattle = "core:good/timber"      # rods, cut like poles
thatch = "core:good/thatch"

[rules]
radius_cm = [150, 400]
eave_cm = [150, 250]
pitch_deg = [45.0, 55.0]
post_spacing_cm = 100            # tuning
post_diameter_cm = 15            # tuning: its rafters are two thirds of it, 10 cm, which carry a big hut's
                                 # thatch through storms of about 2 kPa when sound; 8 cm ones broke at 1 kPa (ADR-0009 §5)
posthole_depth_cm = 60           # tuning
wall_thickness_cm = 15           # tuning
roof_overhang_cm = 50            # tuning
thatch_thickness_cm = 30         # tuning
hearth_cm = 80                   # tuning
floor_base_m2 = 6.0              # 10-06 §2.3: 6 m² plus 4.8 m² a resident, 30 m² for five
floor_m2_per_sleeper = 4.8
store_kg_per_m2 = 100.0          # goods the floor holds besides living on it (tuning; ADR-0009 §3): households of the
                                 # ten-year smoke worlds held at most 83 kg/m² of what keeps better under a roof
groundwork_h_per_m2 = 3.0        # 11-04 §2.6: groundworks, floor and completion 20-40 pd8 for 30 m², split with finish
posthole_h = 0.5                 # 11-04 §2.2: digging 0.25-0.8 pd8/m³; a posthole is about 0.03 m³, setting out included (tuning)
post_h = 2.0                     # 11-04 §2.2: pole-and-lashing frame 0.1-0.5 pd8/m² of footprint; posts and rafters
rafter_h = 1.6                   # together come to about 0.3 pd8/m² for 30 m²
wattle_h_per_m2 = 1.0            # weaving wattle: the research gives no figure (tuning)
daub_h_per_m2 = 2.0              # 11-04 §2.2: cob 1.5-4 pd8/m³; 15 cm of daub is about 1.7 pd8/m³
thatch_h_per_m2 = 2.4            # 11-04 §2.2: fixing thatch 0.2-0.6 pd8/m² of roof
finish_h_per_m2 = 3.0            # 11-04 §2.6, with groundwork
post_kg = 34.0                   # 11-08 §2.1: a 15 cm post 2.4 m long at 760 kg/m³
rafter_kg = 33.0                 # a 10 cm rafter about 5 m long, the same wood
wattle_kg_per_m2 = 6.0           # the research gives no figure (tuning)
thatch_kg_per_m2 = 30.0          # 11-01 §3: wet thatch about 40 kg/m²; dry, less
