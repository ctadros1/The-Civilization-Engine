# A post-framed workshop in bays: a working floor on the ground, with a store loft (ADR-0009
# §1; research 11-01 §1: production competes with sleeping space at home, and 11-13 §1.5: moves
# out when congestion, fire, noise, theft or customers cost enough; 11-04 §2.6: a small workshop
# is a house shell completed by its equipment). A firm working in one comes with slice O's third
# step. The figures not noted are the longhouse's.
kind = "building"
id = "core:building/workshop"
name = "Workshop"
grammar = "frame"
use = "work"
eave_cm = 220                    # head room to work in (tuning)
pitch_deg = 45.0
roof_by_day = 304
technique = "core:technique/jointed_frame"
skill = "core:skill/building"     # trained by building it (ADR-0009 §6)

[design]                         # what people build to (tuning)
bay_cm = 300
width_cm = 500
post_cm = 15
wall_cm = 15
overhang_cm = 50
joist_cm = 15

[systems]                        # what opens frame version 3's to 5's systems (ADR-0031 §2, ADR-0037 §3)
trussed_roof = "core:technique/trussed_roof"
storeyed_posts = "core:technique/storeyed_frame"
wall_ties = "core:technique/tied_masonry"
skeleton = "core:technique/skeleton_frame"   # frame version 4 (ADR-0037 §3)
concrete = "core:technique/reinforced_concrete"   # frame version 5 (ADR-0037, 2026-11-01)

[upkeep]
# How its parts wear and decay (ADR-0009 §4): for each kind, the share of its section or covering
# lost a year and the share at which it shows. Thatch wants significant mending every 2-3 years
# (11-08 §2.4); no report gives rates for posts set in the ground or for daub at a wall's foot
# (11-06 §2.2, 11-08 §2.4: decay needs wet wood, and earth walls last as long as water is kept
# off them), so those are tuning values. Posts rot at their foot on ground of wetness 1 (the land
# profile's habitats set it); timber under a roof decays only under a leak, at the rate given for
# a full leak.
covering = [0.06, 0.15]          # [lost a year, leaks at]
posts = [0.02, 0.3]              # [lost a year at the foot, rot shows at] (tuning)
infill = [0.05, 0.2]             # [worn a year at the foot, shows at] (tuning)
under_leak = [0.1, 0.1]          # [lost a year under a full leak, shows at] (tuning: before it is too weak to carry)

[materials]
timber = "core:good/timber"
wattle = "core:good/timber"
covering = "core:good/thatch"
boards = "core:good/timber"
frame = "core:good/steel_section"   # a skeleton's posts, beams and joists (ADR-0037 §3)
concrete = "core:good/concrete"     # a concrete frame's cast members (frame version 5)
bar = "core:good/reinforcing_bar"    # the bar cast in them

[frame]
bays = [1, 4]
bay_cm = [200, 400]
width_cm = [400, 600]
storeys = [1, 1]
eave_cm = [180, 300]
pitch_deg = [45.0, 55.0]
joist_cm = [8, 25]
post_cm = [12, 30]
overhang_cm = [20, 120]
floor_raise_cm = [0, 0]
wall_cm = [10, 25]
lofts = true
ground = "work"
upper = "store"
posthole_depth_cm = 70
beam_cm = 15
rafter_cm = 10
rafter_spacing_cm = 60
joist_spacing_cm = 60
decking_cm = 4
thatch_thickness_cm = 30
hearth_cm = 90
door_cm = 120                    # wide enough for loads (tuning)
floor_base_m2 = 0.0
floor_m2_per_sleeper = 4.8
work_m2_per_worker = 6.0         # the research gives no figure (tuning; 11-13 §2.1)
store_kg_per_m2 = 500.0
loft_kg_per_m2 = 150.0
living_kg_per_m2 = 100.0
timber_kg_per_m3 = 760.0
# A skeleton's members over their envelope: steel's 7850 kg/m³ times an I-section's 0.1425 of the
# envelope's area (ADR-0037 §3; the design prior of steel_section's [timber]).
frame_kg_per_m3 = 1119.0
# A concrete frame's members over their envelope (frame version 5; design priors): a cast member
# is 1.6 times the envelope's diameter (concrete's [timber]), so 2.56 cubic metres cast for each
# of envelope, at 2,250 kg of dry mix and 120 kg of bar a cubic metre cast (research 11-14 §2.3:
# 80-220 kg of bar) and 25 hours a cubic metre cast to make and set the forms, fix the bar, cast
# and strip (11-14 §2.3 puts formwork at 35-60 % of the cost).
concrete_kg_per_m3 = 5760.0
bar_kg_per_m3 = 307.0
concrete_h_per_m3 = 64.0
# A steel skeleton cased in concrete against fire (ADR-0037 §5; design priors): the casing fills
# the member's envelope about the section, 2,250 kg of dry mix a cubic metre of envelope, 15 hours
# to form and cast it, holding a fully involved fire off its steel for 90 minutes (research 11-14
# §2.5: 30-120 by thickness).
encasement_kg_per_m3 = 2250.0
encasement_h_per_m3 = 15.0
encasement_min = 90.0
groundwork_h_per_m2 = 3.0
posthole_h = 0.8
post_h = 12.0
beam_h_per_m = 4.0
rafter_h = 2.0
joist_h_per_m = 1.0
wattle_h_per_m2 = 1.0
daub_h_per_m3 = 13.3
thatch_h_per_m2 = 2.4
finish_h_per_m2 = 3.0
decking_h_per_m2 = 2.0
ladder_h = 4.0
wattle_kg_per_m2 = 6.0
thatch_kg_per_m2 = 30.0
ladder_kg = 15.0
mass_wall_cm = [30, 90]          # ADR-0031 §1: a mass wall's own range, from frame version 3 (tuning)

[frame.masonry]
# Each kind of mass wall: [hours to lay a cubic metre, kilograms a cubic metre, strength in
# compression in pascals] (ADR-0031 §1; slice BF's figures, which no report gives: tuning).
rubble = [32.0, 1900.0, 1.5e6]
mud_brick = [16.0, 1600.0, 1.0e6]
fired_brick = [20.0, 1800.0, 3.0e6]
