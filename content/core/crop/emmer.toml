# Emmer wheat grown by hand with hoe and sickle (research 08-02, 08-01, 07-04). Labour is in
# person-hours of a capable adult. The research gives no sowing or harvest dates for a temperate
# valley at 48 degrees north, so the calendar is a tuning value for spring sowing; it does put
# field-work windows at 15-45 days (08-01 §2.3).
kind = "crop"
id = "core:crop/emmer"
name = "Emmer"
good = "core:good/grain"
seed_good = "core:good/seed_grain"
seed_kg_per_ha = 90.0            # 08-02 §4.2: 90 kg/ha (70-120)
yield_kg_per_ha = 900.0          # 03-06 §2.7: a Neolithic-style experiment averaged 0.9 t/ha for emmer; 08-02 §4.2 0.8 t/ha (0.5-1.2); 08-01 §2.2 hulled wheat 0.7-1.2
prepare_from_day = 59            # 1 March (tuning)
sow_from_day = 80                # 21 March (tuning)
sow_until_day = 125              # 5 May: a 45-day window (tuning)
late_sowing_loss_per_day = 0.005 # tuning: sown at the end of the window, a crop loses about a fifth
grow_days = 120                  # tuning: ripe from mid-July to early September
standing_loss_per_day = 0.02     # tuning: reap before the crop lodges or sheds (07-04 §1.3)
untended_loss = 0.4              # tuning: what weeds take from a crop nobody tends
break_h_per_ha = 1000.0          # 08-02 §3.1: hand preparation 500-1,000 h/ha; new ground at the top
# Re-working ground cropped before is lighter than breaking it: 08-02 §3.2 budgets 90 days/ha
# (720 h) to prepare and sow fully hoed ground, and §8 notes that full digging and light hoeing are
# separate techniques whose difference can dominate a household's capacity. Here re-working is
# taken at half the fully hoed budget for preparing (a tuning value)...
prepare_h_per_ha = 300.0
sow_h_per_ha = 120.0             # ...and sowing at a sixth of the fully hoed 720 h
tend_h_per_ha = 200.0            # 08-02 §3.2: weeding and tending 25 days/ha
reap_h_per_ha = 280.0            # 08-02 §3.2: harvest and field collection 35 days/ha (flint sickles 250-333 h/ha, §3.1)
thresh_h_per_kg = 0.1            # 08-02 §3.2: threshing, drying and sorting 10 days/ha at 800 kg/ha
straw_good = "core:good/thatch"  # long straw for roofs
straw_kg_per_kg = 1.0            # tuning: old wheats grow 1.5-2 kg of straw per kg of grain; sickles leave the rest as stubble
# Water (ADR-0012 §2): the crop's need is the reference evapotranspiration times its coefficient,
# by stage (FAO-56's curve; research 03-02 §2.1 gives wheat 450-650 mm a season and maize's 0.40
# rising to 1.15). Its harvest falls by Ky for each share of the need unmet: 1.15 for spring wheat
# (08-02 §7.2). The stage lengths are tuning values for a 120-day spring crop.
kc = [0.4, 1.15, 0.4]
kc_days = [30, 30, 40, 20]       # initial, development, mid-season, late
ky = 1.15
n_kg_per_kg_grain = 0.02
n_kg_per_kg_straw = 0.005
roots_n_kg_per_ha = 15.0
