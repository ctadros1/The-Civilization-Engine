# Cholera (M6a slice AZ; ADR-0021 §5): an acute infection that passes by water and between those
# who share a home. Its clocks are research 05-03 §2.1's; how many fall ill and die comes from who
# meets it, never from here. No world has it until the observer brings it (ADR-0021 §8).
kind = "disease"
id = "core:disease/cholera"
name = "Cholera"
routes = ["water", "household"]
# Infection to symptoms: 12 hours to 5 days (05-03 §2.1, high confidence), as a lognormal of mean
# 1.5 and sd 1 day (a design prior inside that range).
incubation_days = [1.5, 1.0]
# Shedding begins with the illness, or at that time in those with no symptoms, and lasts 1-10 days
# "including infections with few or no symptoms" (05-03 §2.1): mean 5, sd 2.5.
shed_lead_days = 0.0
shed_days = [5.0, 2.5]
# 05-03 does not give the share of infections with symptoms; most are mild or silent ("few or no
# symptoms"). A design prior.
symptomatic = 0.25
# Days ill: a design prior (the research gives none).
ill_days = [4.0, 1.5]
# Of those ill, the share severely so (dehydrated), flat by age for want of evidence (05-03 §3.3:
# no defensible age matrix); a design prior.
severe_by_age = [[0, 0.4], [80, 0.4]]
# While severely ill, the chance a day of dying: 0.2 a day over the illness kills about half of the
# severely ill untreated, 05-03 §3.2's "can reach approximately 50%" of clinical cases taken for the
# severe (a design prior; rehydration, slice AZ later, brings it toward under 1%).
severe_death_per_day = 0.2
# Protection after an infection: "at least 3-10 years" (05-03 §2.1, moderate confidence).
immunity_years = [3.0, 10.0]
# The hazard a day each shedding member of a household puts on each other member (hands, food and
# shared vessels): a tuning value, calibrated on attack patterns (05-03 §2.2: no portable R0).
household_hazard = 0.03
# What one shedding person adds to their household's heap a day, in doses: an amount that, drunk,
# is a hazard of one (12-02 §5.4's exponential with its rate taken into the dose). The research
# gives the structure, not these numbers: design priors, calibrated in the step-two probe (plan
# §9) so that a heap's wash into a well beside it gives its drinkers a dose of the order of one.
# The ill shed far more than the silent (rice-water stools), so a hundredth (a design prior).
shed_ill_per_day = 2000.0
shed_silent_per_day = 20.0
# The share of a load that dies a day outside a person, in heaps, ground and water: cholera
# "can also involve aquatic environmental persistence" (05-03 §1.2), so a slow rate, a half-life
# of about five days (a design prior).
decay_per_day = 0.13
# Care (content API 74; ADR-0021 §5). A day's care is two hours of a carer's time (05-05 §2.2:
# 1-4 caregiver-hours a patient-day for basic nursing, a scheduling assumption), and such a severe
# day is 0.95 as deadly (05-05 §2.2's prior for organized supportive care, low confidence). A carer
# who knows fluid replacement brings it to 0.05: some 4 % of the severely ill die, about 1.6 % of
# the ill, between the 1971 refugees' 3.6 % and the demonstration unit's 1 % (05-05 §2.1; 05-03
# §3.2: "below 1%" with adequate rehydration). Both are design priors.
care_h_per_day = 2.0
care_rr = 0.95

[[treatment]]
technique = "core:technique/fluid_replacement"
rr = 0.05
