# A struck piece of metal, counted (M7d slice CE, ADR-0027 §6): a polity's mint strikes it from
# metal to the weight and fineness its law sets, and each issue is kept apart in its holders'
# purses. Counting a piece of a known issue takes about a second (a tuning value), so a kilogram
# paid in 8 g pieces is counted in about two minutes against six for weighing and testing metal.
kind = "good"
id = "core:good/coin"
name = "Coin"
purpose = "material"
kcal_per_kg = 0.0
half_life_days = 0.0
sheltered_half_life_days = 0.0
eaten = "never"
shared = false
reserve_for = ""

[money]
verify_h = 0.0003
coin = true
# Struck of copper; those who know how to smelt it can tell how much a piece holds (content API
# 130, M7d slice CE4a, ADR-0027 §6), and value it by that.
metal = "core:good/copper"
assay = "core:technique/copper_smelting"
