# Fallen wood, gathered and burned for cooking and warmth (research 03-06 §2.5). Kept dry, it
# does not spoil on the time scales that matter here.
kind = "good"
id = "core:good/firewood"
name = "Firewood"
purpose = "fuel"
kcal_per_kg = 0.0
half_life_days = 0.0
sheltered_half_life_days = 0.0    # a roof makes no difference
eaten = "never"
shared = false
reserve_for = ""

# Heat by weight (research 07-06 §2.3, IPCC default for wood): the measure hearths are given in.
[fuel]
mj_per_kg = 15.6
smoke = 1.0
# Ash a kilogram burned leaves (ADR-0038 §2; research 12-10 §2.1: 0.3-1.0 % for Central European
# woods): it goes on the household's heap, or to a works' store as `good/ash`.
ash_share = 0.005
