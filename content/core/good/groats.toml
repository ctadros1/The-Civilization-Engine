# Grain pounded in a mortar and boiled as porridge: the way to eat grain without a quern (research
# 07-04 §6.5: household grinding and non-bread grain foods must stay possible). It keeps like
# cracked grain; the half-lives are tuning values.
kind = "good"
id = "core:good/groats"
name = "Groats"
purpose = "food"
kcal_per_kg = 3340.0
half_life_days = 60.0
sheltered_half_life_days = 90.0
eaten = "cooked"
# Firewood a kilogram takes cooked on an open fire (research 08-24 §2; content API 237): boiled as
# porridge: 0.35 kg of wood a kilogram cooked, four parts cooked to one dry (a design prior).
cook_wood_kg = 1.4
shared = false
reserve_for = ""

# How it burns (ADR-0022 §5; content API 81).
# Groats under a burning roof are mostly lost (a design prior).
[fire]
catch_kw_m2 = 0.0
burns = 0.8
