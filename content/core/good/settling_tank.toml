# A settling tank at a sewer's outfall (ADR-0041 §4; research 12-10 §1.7, §5.8): brick tanks laid
# in lime where the flow stands long enough for its solids to sink. Held whole by a sewer's keeper
# (its polity's store, or a household), it settles the sewer's `settle_share` of each day's load as
# sludge. 40,000 hours of life is a design prior. It stays where it was built; a household that
# knows settling may build one (`recipe/build_settling_tank`).
kind = "good"
