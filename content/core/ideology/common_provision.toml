# An ideology (M4c slice AG, ADR-0016 §4; research 06-04 §6.1: problem explanation, moral
# commitments, institutional proposals, legitimacy narrative). A holder weighs every law with its
# commitments beside their own values, and, when the problem it explains is before the village,
# weighs the laws of its program among their moves. It travels only with people: some founders bring it, a child may
# take it up from a parent, and a holder now and then speaks of it at the hearth, where a listener
# takes it up by their trust in the teller and how well it fits what they hold dear. Every number
# under [spread] is a design prior, not an estimate.
kind = "ideology"
id = "core:ideology/common_provision"
name = "common provision"
description = "Want comes from lean years no household can see coming; what the village gathers together, it keeps against them."
explains = "food_short"
legitimacy = "what the village gathers, the village keeps against a lean year"
program = ["core:policy/common_store", "core:policy/keep_store"]

[commitments]
"core:value/security" = 0.5
"core:value/reciprocity" = 0.3

[spread]
founders = 0.1      # a tenth of the founders bring it
share = 0.0005      # the chance a holder speaks of it to a companion at the hearth, a session
adopt = 0.3         # taken up by a listener who trusts them fully and holds just what it holds
inherit = 0.5       # the chance a child takes up a parent's
w_program = 1.0     # points it adds to proposing a law of its program
