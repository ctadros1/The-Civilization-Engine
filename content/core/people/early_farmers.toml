# Learners one person teaches at once (research 07-02 §2.3: 1-3 a teacher).
max_learners = 2
# Utility points for working beside someone to learn what they know: about what useful work is
# worth (a tuning value).
w_learn = 2.0
# The share of routine work's hours that counts as experiment toward what its practice can find
# (research 07-01 §2.3: 1 %, tested 0-5 %).
experiment_share = 0.01
# Trying counts three times its hours for someone already aware of what they try toward:
# finding again what is known of is easier than inventing (07-02 §1.7; a tuning value).
aware_try_factor = 3.0
# Utility points for trying at a problem at home, times the share of the household's food it
# would cost (a tuning value, about what useful work is worth).
w_try = 2.0
# Least days between one person's sessions of trying: an hour a week at most, about 2 % of
# working time (07-01 §2.3 tests 0-5 %; 07-11 §2.2 finds 0-10 % protected time for craft workers).
try_gap_days = 7.0

[ties]                           # what people remember of one another (ADR-0014); tuning values
# Ties a person keeps (research 04-06 §2.2: 32-128 directed records; 04-11 §2.4: 16-64). When a
# new one needs room, the least salient without a debt over `hold_help_h` is let go.
room = 48
# People at the hearth a session's company touches: never everyone present (04-04 §1.5, §5.3).
companions = 3
# Good and bad evidence a stranger starts from, each in every domain (04-06 §5.2's prior counts).
prior = 1.0
# Routine evidence fades halfway back to the prior in half a year (04-06 §2.2: sweep 30-365 days).
evidence_half_life_days = 180.0
# Familiarity without meeting (04-04 §2.2: 90-365 days).
familiarity_half_life_days = 180.0
# Warmth without reinforcement (04-04 §2.2: 1-5 years).
warmth_half_life_days = 730.0
# Fear, written from M4b (04-06 §2.2: severe events 7-90 days of activation; durable memory is
# longer, and no figure is settled).
fear_half_life_days = 365.0
# Help owed or owing (04-11 §2.4: personal obligations remembered 1-10 years).
help_half_life_days = 1095.0
hold_help_h = 4.0
# Salience of a unit of evidence beyond the prior, beside familiarity and warmth (0-1 each).
salience_per_evidence = 0.1
# The share of a session's company drawn from those present one does not yet know; the rest comes
# from those one knows, the better known the likelier (04-04 §1.5: people keep up the ties that
# matter; §2.2 proposes 5-20 % of new encounters come by introduction).
new_share = 0.15
# Minutes further a household short of food walks to ask someone its members regard (esteem and
# warmth together, up to 1) than a stranger, among those who could give it as much (04-06 §1.6:
# kin, community and strangers start from different priors; the figure is a tuning value).
ask_known_min = 30.0
# What each act writes into its holder's tie, for each act or, at the hearth and in learning, each
# hour. `familiarity` and `warmth` close that share of the gap to 1; `good` and `bad` add evidence
# in `domain` (04-04 §1.6: help gives trust and obligation, skilled work respect, repeated
# encounters familiarity; enjoyable company warmth at 0.005-0.02 an hour, 04-04 §2.2).
acts = [
  { act = "gift_received", familiarity = 0.2, warmth = 0.1, domain = "provision", good = 1.0, bad = 0.0 },
  { act = "gift_given", familiarity = 0.1, warmth = 0.02, domain = "none", good = 0.0, bad = 0.0 },
  { act = "wages_paid", familiarity = 0.05, warmth = 0.0, domain = "word", good = 1.0, bad = 0.0 },
  { act = "work_seen", familiarity = 0.05, warmth = 0.0, domain = "craft", good = 0.5, bad = 0.0 },
  { act = "rent_paid", familiarity = 0.05, warmth = 0.0, domain = "word", good = 1.0, bad = 0.0 },
  { act = "land_lent", familiarity = 0.05, warmth = 0.0, domain = "word", good = 1.0, bad = 0.0 },
  { act = "traded", familiarity = 0.1, warmth = 0.0, domain = "word", good = 0.5, bad = 0.0 },
  { act = "learned_from", familiarity = 0.02, warmth = 0.005, domain = "craft", good = 0.1, bad = 0.0 },
  { act = "hearth", familiarity = 0.1, warmth = 0.01, domain = "none", good = 0.0, bad = 0.0 },
  # M4b slice AA (content API 35): coming to believe the other took food weighs against them in
  # provision, three times a gift's weight when it was from one's own household (04-06 §1.6:
  # negative evidence weighs more than positive; the figures are tuning values); giving back what
  # was taken keeps one's word, refusing breaks it.
  { act = "took_from_us", familiarity = 0.0, warmth = 0.0, domain = "provision", good = 0.0, bad = 3.0 },
  { act = "took_from_others", familiarity = 0.0, warmth = 0.0, domain = "provision", good = 0.0, bad = 1.0 },
  { act = "restored", familiarity = 0.0, warmth = 0.0, domain = "word", good = 1.0, bad = 0.0 },
  { act = "refused_restitution", familiarity = 0.0, warmth = 0.0, domain = "word", good = 0.0, bad = 2.0 },
]

[standing]                       # standing and notables (ADR-0014 §3-4); tuning values
# How many people each adult counts among those they esteem most (04-11 §2.4: 4-12 candidates).
candidates = 8
# Notables: the share of a settlement's adults who deliberate weekly (plan §4.2: about 1 %), at
# least `notable_floor` of them, each keeping the place while ranked within `notable_keep` times
# their number (04-11 §5.7: display hysteresis). A compute tier only: being one grants nothing.
notable_share = 0.01
notable_floor = 3
notable_keep = 1.5

[polity]                         # the polity, its gathering and its laws (ADR-0013); tuning values
# Notables, the elders of households short of food, and whoever came to a gathering or learnt a
# law since the last review weigh what to propose once a week (ADR-0014 §4: notables deliberate
# weekly, others when something reaches them; research 09-01 §3.3 gives 7-30 days for review).
review_days = 7
notice_days = 1                  # a proposal goes to the gathering the next evening
gathering_minutes = 120          # the gathering sits from an hour before sunset, for two hours
# The founding custom (ADR-0013 §1): the adults who come to the hearth decide by acclamation, more
# for than against, a tie failing. A quarter of the adults must come (no figure in the reports).
quorum_share = 0.25
# Forecasts are the change in the log of a year's food above subsistence, so food near the edge is
# worth the most (research 09-17 §1.2: households insure one another, and a store pools that).
# Points per unit of it, for proposing and for a stance.
w_gain = 10.0
w_regard = 1.0                   # points for full regard for a law's sponsor
stance_margin = 0.25             # points either way within which a member abstains
attend_base = 1.0                # the custom's own pull to the gathering, points
w_attend = 0.5                   # points per point at stake in what it decides
w_followers = 0.5                # a sponsor weighs those who regard them at half their household
propose_cost = 0.5               # points a proposal costs its sponsor
temperature = 0.5                # of the choice among moves, points
# Content API 34: one who came to a gathering expects no more support for the same proposal than
# they saw it get there, for a year (research 09-05 §1.2: a sponsor weighs expected success; the
# year is a tuning value).
vote_memory_days = 365
# The lean years people believe in before they have seen any: one in four (a prior, no figure in
# the reports). Lean years seen are those the settlement's food ran short in.
prior_lean = 1.0
prior_years = 4.0
lean_harvest = 0.5               # a lean year's harvest, as a share of an ordinary one
# Below half a year's food a household cannot live through the year: food there is worth the most,
# and a household that would fall below it by paying a levy cannot pay (09-01 §6.4).
subsistence_share = 0.5
# Paying a levy is the payer's choice: the custom that a gathering binds, and where they stood on
# the law, against what paying costs their household. No sanction until M4b.
comply_base = 1.5
w_stance = 1.0

[crime]                          # taking, what is seen of it and what is owed (ADR-0015); tuning values
# Research 04-09 §5.4 finds no established figures for moral-cost weights, belief-update rates or
# the conversion of hunger into offending: every value here is a tuning value, to be tested.
# A person's objection to taking what is not theirs, 0-1: the log-odds of a founder's is drawn
# from a normal of this mean and spread, and a child's is pulled toward its parents' with this
# heritability (04-09 §1.1: social learning; §5.1: an offence-specific objection, kept apart from
# personality and self-control). With these, about one person in six falls below the filter.
objection_mean = 2.5
objection_sd = 1.2
objection_heritability = 0.5
# At or above this objection, taking is not weighed at all (04-09 §5.3: a moral filter first, or
# a noisy chooser "may eventually make almost everyone offend").
objection_filter = 0.8
# Points against taking: for a full objection; for a certainty of being seen (what the taker
# believes being seen would cost them with those who would hear, scaled by exp(-w_risk_trait *
# risk) for their risk-taking); and for full regard for the one taken from. A household out of
# food weighs a load of grain at up to about 30 points (`[decision]` w_food and w_hunger), so only
# real need outweighs these (04-09 §5.3: U = G - C - M - I - p̂L, on one scale).
w_objection = 20.0
w_seen = 10.0
w_risk_trait = 0.3
w_regard = 5.0
# The chance of being seen someone believes before they have taken or heard of a taking, and the
# share of the gap their own attempt, or a taking they hear of, closes (04-09 §5.4: p̂ ← (1 - α)p̂ +
# αs; word comes only of takers who were seen, a selected sample).
risk_prior = 0.5
risk_alpha = 0.3
risk_alpha_told = 0.1
# Guardianship is settled on arrival (12-04 §1.4, 04-09 §1.1: routine activity, which turns on
# capable guardians): a member of at least `guardian_age` home and awake and the taker turns back;
# anyone else of that age awake within `sight_m` metres the taker notices with `notice_chance`
# each, and turns back for; those they miss, and younger children, see them at it; a grown
# sleeper at home wakes with `wake_chance`. One who turned back or fled waits between half and one
# and a half times `retry_hours` before weighing taking again (12-04 §1.4: an offender may change
# their timing).
sight_m = 30.0
notice_chance = 0.7
retry_hours = 12.0
guardian_age = 10.0
wake_chance = 0.25
# Days a person keeps what they believe of a taking; within them a household refuses the asks of
# someone it believes took from it, or from a household whose elder one of its members regards at
# least this much (12-04 §1.2: exclusion is credible when enough people will back it).
remember_days = 730
refuse_regard = 0.5
# A household that learns who took from it demands the food back, or lets it go (09-07 §4.1: U =
# p̂(success) p̂(enforcement) V - C): points toward demanding, per day of its food taken, and
# against, for full regard for the taker. The taker's household answers once: points toward
# paying, for the share of its settlement's households that believe the taker took and for
# regard for the household owed, against the days of its own food paying would cost. It pays from
# food beyond `keep_days` of its need, until `due_days` after the demand; what it cannot pay is an
# arrear (09-07 §1.2: an award creates no goods).
demand_base = 0.0
w_demand_loss = 1.0
w_forgive = 3.0
due_days = 30
comply_base = 0.0
w_comply_known = 4.0
w_comply_regard = 2.0
w_comply_cost = 0.5
keep_days = 3.0
