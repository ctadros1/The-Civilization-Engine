# Keeping watch (M4b slice AC, ADR-0015 §6: a watch is an office named by a law, as the
# storekeeper is): the one the gathering names walks rounds of the settlement's homes at night,
# standing watch at each, and sees and guards only where they are (research 12-04 §1.4: a patrol
# affects the places it visits; §1.3: a watch is a specialization households set up when they
# expect it to protect their stores). The office is unpaid: office pay is not built. The law names
# its holder and lapses when they die or leave. Whether anyone proposes a watch, whom, and whether
# the gathering agrees, is people's choice.
kind = "policy"
id = "core:policy/keep_watch"
name = "Watch"
description = "The one the gathering names keeps watch over the households' stores at night, walking rounds of the homes."
does = "keep_watch"
answers = ["takings"]
# The question people take positions on (content API 41, M4c slice AG): each adult's is
# anchored in what their household's lot makes of it and moved by talk at the hearth.
question = "whether to keep a watch over the stores at night"

# How a law of this kind bears on what people hold dear (content API 43, M4c slice AG): -1
# against a value to 1 for it. An authoring judgement, not a measurement.
[bears]
"core:value/security" = 1.0
"core:value/autonomy" = -0.5    # someone walks the village at night
