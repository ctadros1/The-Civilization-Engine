# Pay for common work (M7d slice CE3a, ADR-0027 §6: the polity's first spending; research 08-06
# §1.6: the ruler must distribute the new issue through transactions). Under it the polity's store
# pays each household, for each hour it gives to the polity's crossing, well, flood bank or
# palisade, `per_hour` of the money it names, as far as the store holds it; hours it cannot pay
# for go unpaid. Eight pieces of 8 g are 64 g of copper, about what an hour of the whole work of
# making copper gives (some 14 hours a kilogram, ore to metal; a tuning value). Whether anyone proposes it, and whether a gathering passes it, is people's.
kind = "policy"
id = "core:policy/pay_work"
name = "Pay for common work"
description = "The store pays coin for the hours households give to the village's common works."
does = "pay_work"
answers = ["coin_idle"]
question = "whether the store pays coin for the hours households give to the common works"

[pay]
good = "core:good/coin"
per_hour = 8.0

# An authoring judgement, not a measurement.
[bears]
"core:value/reciprocity" = 1.0
