# A well dug together (M6a slice BA, step four; ADR-0021 §7; the M6 health brief §1.8: "a well
# built together at a named site, as `BuildCrossing`: an equal share of work asked, nothing
# following a share not given, owned by the polity and open to its people"). When a household of
# the settlement walks far for water, as it last walked it (so far that its people use less water
# for the walk, research 12-01 §2.1), and a well beside the hearth would save the settlement's
# households more walking over its lining's life than its work (the issue `water_far`), anyone
# may propose that the polity dig one there, a metre below where its people expect water. A
# household weighs it by the walking a year it would save its own people, less its share of the
# work spread over the lining's life, each hour worth the food an hour of its own work brings
# (research 11-07 §2.3: communal labour priced at the production it forgoes); what it holds dear
# weighs beside that. Once passed the polity begins it, and each household is
# asked an equal share of its work: its people give it as they choose, weighing the gathering's
# word as a levy's payment is weighed, and nothing follows a share not given (research 09-06).
# Once it meets water, the polity's people may draw at it. Whether anyone proposes one, whether
# the gathering passes it, and whether it is ever finished, is people's choice. Its id sorts
# after every older template's: hearth talk about a question is keyed by a template's place in
# id order.
kind = "policy"
id = "core:policy/works_well"
name = "Well dug together"
description = "The polity digs a well beside the hearth, and each household is asked an equal share of the work."
does = "dig_well"
answers = ["water_far"]

# How a law of this kind bears on what people hold dear: -1 against a value to 1 for it. An
# authoring judgement, not a measurement, as for a crossing built together: a share of every
# household's hours is asked.
[bears]
"core:value/autonomy" = -0.5
