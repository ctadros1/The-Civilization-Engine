# A watch tower raised together for the watch (M8d slice DC, third part; ADR-0031 §6, shaped as the
# storehouse raised together). When a fire burns a while before anyone sees it, a building that
# did not catch from a neighbour already burning, the work its building takes to put right is
# measured against the polity a year (the issue `fires_unseen`, open while a watch keeps watch to
# look out from a tower). Anyone who knows how to frame a building may then propose that the
# polity raise a watch tower by the hearth. A household weighs it by its share of that work a year,
# each hour worth the food an hour of its own work brings, less its equal share of the work of the
# tower spread over the years it weighs. Once passed, the polity lays it out near the hearth, and
# each household is asked an equal share of the work: its people give it as they choose. Finished,
# a watch round begins at it, and whoever stands at it sees a burning roof much further off.
# Whether anyone proposes one, whether it passes, and whether it is finished, is people's choice.
# Its id sorts after every older template's: hearth talk about a question is keyed by a template's
# place in id order.
kind = "policy"
id = "core:policy/yourselves_watch_from_a_tower"
name = "Watch tower raised together"
description = "The polity raises a watch tower by the hearth for its watch to look out over the roofs from, and each household is asked an equal share of the work."
does = "raise_building"
answers = ["fires_unseen"]

[raise]
program = "core:building/watch_tower"

# How a law of this kind bears on what people hold dear: -1 against a value to 1 for it. An
# authoring judgement, not a measurement, as for a storehouse raised together.
[bears]
"core:value/autonomy" = -0.5
