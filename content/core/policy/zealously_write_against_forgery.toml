# A law against counterfeiting (M10d slice EK, third part; ADR-0035 §11: "a law may set against
# counterfeiting"; brief m10-money §7). Where false notes passed by or to a polity's households
# were found, refused at payment by one who knows the writing or kept at their issuer's door (the
# issue `false_notes_found`), anyone may propose that the gathering hear it: a household that found
# false pieces may bring a case against the one that passed them, and a finding imposes the bundle,
# as a law against taking does. Nothing was taken from the finder, so no bundle is restitution
# alone. Making false notes weighs the bundle where the law stands. The amounts are tuning values,
# not historical rates; whether anyone proposes it, with which bundle, and whether a gathering
# passes it, is people's choice.
# Its id sorts after every older template's: hearth talk about a question and a saved law are
# keyed by a template's place in id order, so an id sorting earlier would shift theirs.
kind = "policy"
id = "core:policy/zealously_write_against_forgery"
name = "Law against counterfeiting"
description = "Whoever is found to have passed false notes owes the household that found them, and may owe the common store more besides."
does = "against_counterfeiting"
answers = ["false_notes_found"]
question = "whether the gathering should hear false notes passed"

# An authoring judgement, not a measurement: notes kept honest, at the cost of a hearing.
[bears]
"core:value/security" = 0.5
"core:value/reciprocity" = 0.5

# Days are days of the passer's household's food.
[[bundles]]
compensation_days = 3.0   # three days' food to the household that found them
fine_days = 0.0

[[bundles]]
compensation_days = 3.0   # and three more to the common store
fine_days = 3.0

[[bundles]]
compensation_days = 3.0   # and the one found to have passed them is sent from the valley
fine_days = 3.0
exile = true
