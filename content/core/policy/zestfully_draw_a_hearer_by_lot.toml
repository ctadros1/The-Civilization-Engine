# A hearer drawn by lot for a year (backlog D; research 09-07 §1.3: who decides is its own choice,
# and rotation and lottery are selection primitives of their own; Athens drew its courts by lot;
# 09-02 §4.1: Athens filled its magistracies annually; 09-14 §2.2: a rotating office's term is
# three to twelve months). Passed, a lot draws the hearer from those who stood for it at the
# gathering (taking wanting cases heard as willingness to hear them, a design prior, as for the
# store kept by turns), and they hear the cases brought under the laws against taking and raiding
# alone, as one the gathering names does, never one their household is party to. The office
# lapses at the year's end and cases go to the gathering again; the one who heard them may not be
# drawn for the next year. With nobody to draw, the law lapses at once. Whether anyone proposes a
# hearer by lot, and whether the gathering agrees, is people's. Its id sorts after every older
# template's: hearth talk about a question is keyed by a template's place in id order.
kind = "policy"
id = "core:policy/zestfully_draw_a_hearer_by_lot"
name = "Hearer by lot"
description = "A lot draws one of those who want cases heard to hear the cases brought under the laws against taking and raiding, alone, for a year; the one who heard them may not be drawn for the next."
does = "hear_cases"
answers = ["cases_waiting"]
question = "whether one drawn by lot should hear the cases brought, a year at a time"

[forum]
seat = "holder"
hears = ["against_taking", "against_raiding"]
authority = "informative"

[tenure]
term_days = 360
renewable = false
fill = "lot"

# An authoring judgement, not a measurement.
[bears]
"core:value/security" = 0.5
"core:value/reciprocity" = 0.5    # each may take a turn
"core:value/autonomy" = -0.5      # one person decides what the gathering did
