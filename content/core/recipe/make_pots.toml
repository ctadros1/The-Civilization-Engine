# Storage pots, hand-built and fired in an open fire. Ordinary hand-built pottery takes 0.3-2
# person-hours a kilogram of fired ware, clay preparation, forming, a share of the firing and
# sorting included, and 0.5-3 kg of dry wood a kilogram (research 07-05 §2.3): a 4 kg pot at
# 0.75 h/kg is 3 hours, and 1.5 kg of wood a kilogram is 6 kg (tuning within the ranges). 5 kg of
# clay makes one, losing water as it dries and fires (tuning). An hour to lay the fire and set the
# pots in it (08-03 §2.1: open firings of 1-3 hours), and up to 10 a firing, a household's batch
# (tuning; 08-03 §2.1 gives open firings of up to 100). One in ten breaks in the firing (08-03 §2.2's
# worked example: 90 % sound). Drying, days between forming and firing (08-03 §2.1: 1 day and then
# 3-7 more), is not yet kept apart: a session forms and fires its pots.
