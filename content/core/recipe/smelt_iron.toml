# A bloomery smelt: charging a furnace with roasted ore and charcoal and blowing it for a day, then
# leaving it to cool overnight before the bloom is drawn (a batch of one elapsed day, ADR-0033 §2).
# 8 kg of ore and 12 kg of charcoal a kilogram of bloom and three hours of work a kilogram (research
# 07-05 §2.2: 9.1 kg of roasted ore and 20.5 kg of charcoal a kilogram in one experimental run;
# 5.5 person-hours a kilogram of rough bloom with the furnace built). A charge gives up to 8 kg
# (the timed run's bloom). Tuning values within those envelopes. The ore's earth and the iron the
# bloom does not take run off as 6 kg of slag a kilogram of bloom (ADR-0038 §2; a design prior from
# the recipe's own figures: 8 kg of roasted ore at about half iron hold 4 kg, the bloom keeps one,
# and 07-05 §1.1 puts what is not recovered in the slag; the rest of the ore's weight is its oxygen,
# gone to the air).
