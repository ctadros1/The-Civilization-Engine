# A dugout (M8b slice CO; ADR-0029 §2; research 07-08 W02): a hull hollowed from one trunk with
# stone axes and fire, paddled. Dated European dugouts reach back to the eighth millennium BCE
# (07-08 §4, the Pesse dugout), so it needs no farming, metal or state; the technique is the
# woodworking every founder knows. What one takes, carries and lasts are design priors where the
# reports give ranges, not figures.
kind = "vehicle"
id = "core:vehicle/dugout"
name = "Dugout"
mode = "boat"
technique = "core:technique/wood_shaping"
skill = "core:skill/building"
tool = "core:good/axe"
good = "core:good/timber"
# A trunk of about 0.6 m by 6 m (1.7 m³ at the timber good's 760 kg/m³ is some 1,300 kg), most of
# it hollowed away: a design prior.
material_kg = 1300.0
# Felling, shaping and hollowing with stone axes and controlled burning: the reports give no
# hours; a design prior of about 25 eight-hour person-days.
labour_h = 200.0
crew = 3
# 07-08 §2.1: a working dugout carries 0.1-0.7 t; ADR-0029 §2's prior where the tables overlap.
payload_kg = 400.0
# The water a loaded dugout needs under it (a design prior; a hull of 0.7 m beam floating 0.6 t).
draft_m = 0.3
# 07-08 §2.1: 3-6 km/h; still-water paddling at about 4.3 km/h (a design prior inside that range).
paddle_m_s = 1.2
width_m = 0.7
# A dugout kept wet and drawn up lasts years, one left to dry cracks (a design prior).
life_years = 12.0
