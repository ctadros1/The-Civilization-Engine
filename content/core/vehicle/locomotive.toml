# An engine on rails (M10b slice DW; ADR-0034 §3, ADR-0033 §7; the rail brief §1.2, §1.3; research
# 07-08 §5.5 P02, 07-06 §4 "higher-pressure steam systems ... more compact engines; expanded
# transport", around 1800): a boiler and cylinder on four driven wheels of a metre's gauge, some 5
# t, that pulls wagons by the steam of its coal. Its power, 7.5 kW (about 10 hp), and its top
# speed, 2.2 m/s (8 km/h), are design priors near the first engines on plateways (07-08 §5.5:
# Trevithick's 1804 Penydarren, a museum record). Its most pull is what its driven wheels hold
# before they slip, μ·m·g at the brief's μ = 0.2: 9,810 N. It turns 3 % of its fuel's heat into
# work (07-06 §2.3: 2-5 % for improved steam, a design prior), so at full power it burns some 35 kg
# of coal an hour. It carries its own coal and water, 500 kg. Made of 3,000 kg of iron in 3,000
# hours by four smiths (tuning values), under the locomotive; lasts 20 years.
