# A road engine (M11b, second part; ADR-0036 §7: "a motor vehicle is a vehicle whose speed and load
# on a way come from its power over its pull, the way's grade and roughness, burning fuel by its
# work"; research 07-13 §1.6, §5.3 C06). A cart whose puller is an engine burning coal: it goes
# where a cart goes, on ways as wide as it is, never across open ground; its speed is its engine's
# power over the pull its load needs on the way's roughness and grade, no faster than its top
# speed; and a trip burns coal by the hours its engine runs. The figures are design priors of the
# order of a mid-nineteenth-century traction engine (some 8 horsepower, 6 t, a walking pace's
# limit on public roads), not measurements. Making one needs a technique no work tries toward:
# only the observer brings it.
