# A kind of landscape, not a particular world: the seed decides where the mountains and rivers go.
# Values are tuning starting points checked by eye and by the sanity figures `civ-host` prints
# (relief, gentle-land share, discharge), not calibrations. See content/README.md for every field.
kind = "worldgen_preset"
id = "core:worldgen/river_valley"
name = "River valley"
description = "A temperate inland basin: a mountain range drained by a trunk river with broad valley floors and wooded hills."
default = true

[region]
context_factor = 2.0          # simulated watershed, relative to the map
outlet_edges = 1              # context edges at base level (the seed picks which)
base_level_m = 60.0           # elevation where water leaves the region
initial_relief_m = 40.0
regional_slope = 0.004        # m/m toward the base-level edge
trunk_inflow_km2 = 1500.0     # catchment of a river entering from beyond the region (~14 m³/s)
window_offset = 0.0           # 0 = map centred in its watershed

[uplift]
uplift_mm_per_yr = 0.6
lowland_uplift_fraction = 0.04
range_scale_km = 14.0
basin_strength = 0.0

[erosion]
erodibility = 1.0e-5          # stream-power K, drainage area in m²
erodibility_variation = 0.35
area_exponent = 0.5           # m, with n = 1
channel_initiation_km2 = 0.0
diffusivity_m2_per_yr = 0.04
talus_slope = 0.85
endorheic_depth_m = 0.0       # humid: every basin overflows
coarse_iterations = 150
coarse_dt_years = 20000.0

[refinement]
fine_iterations = [10, 6, 3]  # erosion passes at 4x, 2x and 1x the simulation cell
fine_dt_years = 2000.0
detail_amplitude = 0.25
routing_jitter = 0.35
floodplain_min_area_km2 = 2.0
floodplain_width_factor = 45.0

[water]
sea_level_m = 0.0
precipitation_mm_per_yr = 800.0
evapotranspiration_mm_per_yr = 500.0
lake_evaporation_mm_per_yr = 900.0
channel_area_km2 = 0.5
min_lake_depth_m = 2.0
min_lake_area_m2 = 5000.0
channel_width_coefficient = 4.0
