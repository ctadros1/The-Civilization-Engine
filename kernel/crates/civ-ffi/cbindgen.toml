# cbindgen settings for include/tce_kernel.h (ADR-0005). The `header` test generates the header
# and fails when the committed one differs; `TCE_BLESS=1 cargo test -p civ-ffi --test header`
# rewrites it.
language = "C"
header = """/* The Civilization Engine's kernel library, `tce_kernel`: its C interface, ABI 1.
 * See decisions/0005-kernel-c-interface.md. Generated by cbindgen from
 * kernel/crates/civ-ffi/src/exports.rs; do not edit. */"""
include_guard = "TCE_KERNEL_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true
line_endings = "LF"

[parse]
parse_deps = false
