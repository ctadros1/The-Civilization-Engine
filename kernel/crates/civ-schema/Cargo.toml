[package]
name = "civ-schema"
description = "The Civilization Engine's boundary (wire) and save schemas: FlatBuffers code generated by flatc 25.12.19, and the schema identities used in frames and saves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
commons-wire = { workspace = true }
flatbuffers = { workspace = true }

# Not the workspace lints: generated FlatBuffers accessors use `unsafe`, so this crate denies it
# (overridable) instead of forbidding it, and allows it only on the two generated modules.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
